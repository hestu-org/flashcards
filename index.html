@media (prefers-color-scheme:dark){:root{
  --bg:#000; --cell:#1c1c1e; --cell2:#2c2c2e; --text:#fff; --text2:rgba(235,235,245,.62); --text3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.55); --fill:rgba(118,118,128,.24); --bar:rgba(22,22,24,.86);
  --blue:#0a84ff; --red:#ff453a; --orange:#ff9f0a; --green:#30d158; --indigo:#5e5ce6; --gray:#98989d;
  --shadow:none;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior-y:none}
input,textarea,select,.selectable{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
button:disabled{cursor:default;opacity:.4}
svg.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus{outline:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}

/* nav bar */
.nav{position:sticky;top:0;z-index:20;padding-top:var(--sat);background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep)}
.nav.flat{border-bottom-color:transparent;background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}
.nav-in{height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 max(8px,var(--sal)) 0 max(8px,var(--sar))}
.nav-t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw;text-align:center}
.nav-l{justify-self:start;display:flex}.nav-r{justify-self:end;display:flex;gap:4px}
.navbtn{display:inline-flex;align-items:center;gap:4px;min-height:44px;min-width:44px;padding:0 8px;color:var(--blue);font-size:17px;border-radius:10px}
.navbtn.back{padding-left:0}.navbtn.back svg{width:26px;height:26px;stroke-width:2.4;margin-right:-2px}
.navbtn:active{opacity:.5}
.content{padding:8px var(--gutter-r) calc(96px + var(--sab)) var(--gutter-l);max-width:720px;margin:0 auto}
h1.large{font-size:34px;line-height:1.2;font-weight:700;letter-spacing:.2px;margin:2px 0 14px}

/* tab bar */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;padding:4px var(--sar) var(--sab) var(--sal);background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep)}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:49px;justify-content:center;color:var(--gray);font-size:10.5px;font-weight:500}
#tabbar button svg{width:26px;height:26px;stroke-width:1.8}
#tabbar button.on{color:var(--blue)}
body.studying #tabbar{display:none}

/* grouped lists */
.sh{font-size:13px;text-transform:uppercase;letter-spacing:.3px;color:var(--text2);margin:24px 16px 7px}
.foot{font-size:13px;color:var(--text2);margin:7px 16px 0;line-height:1.4}
.list{background:var(--cell);border-radius:12px;overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:11px 16px;text-align:left}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
button.row:active,a.row:active{background:var(--cell2)}
.row-main{flex:1;min-width:0}
.row-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:14px;color:var(--text2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-val{color:var(--text2);white-space:nowrap}
.row .chev{color:var(--text3);width:18px;height:18px;stroke-width:2.6}
.row.blue{color:var(--blue)}.row.red{color:var(--red)}
.row input[type=text],.row input[type=number],.row select{border:0;background:none;color:var(--text2);font-size:17px;text-align:right;min-width:0;width:8em;padding:4px 0}
.row input[type=number]{width:3.5em}
.row select{width:auto;max-width:58%;-webkit-appearance:none;appearance:none;text-align:right;text-align-last:right;color:var(--text2)}
.updown{width:15px;height:15px;color:var(--text3);margin-left:-6px;stroke-width:2.4}

/* decks */
.deck-row{padding:14px 12px 14px 16px;min-height:64px}
.deck-row .row-title{font-size:18px;font-weight:600}
.counts{display:flex;gap:6px;flex:none}
.cnt{display:flex;flex-direction:column;align-items:center;min-width:44px;padding:4px 6px;border-radius:10px;background:var(--fill)}
.cnt b{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.cnt small{font-size:11px;color:var(--text2);line-height:1.1}
.cnt.new b{color:var(--blue)}.cnt.due b{color:var(--green)}.cnt.zero b{color:var(--text3)}

.empty{text-align:center;padding:48px 24px 8px;color:var(--text2)}
.empty .big{font-size:22px;font-weight:600;color:var(--text);margin:14px 0 6px}
.empty-art{width:84px;height:84px;margin:0 auto;border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.empty-art img{width:100%;height:100%;display:block}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:0 18px;border-radius:14px;background:var(--blue);color:#fff;font-weight:600;font-size:17px;text-align:center}
.btn:active{filter:brightness(.88)}
.btn.sec{background:var(--fill);color:var(--blue)}
.btn.small{min-height:40px;width:auto;padding:0 14px;border-radius:10px;font-size:15px}
.btn.red{background:var(--red)}
.btn+.btn{margin-top:10px}
.linkbtn{color:var(--blue);padding:8px;min-height:40px;font-size:15px}

/* banner */
.banner{background:var(--cell);border-radius:14px;padding:14px 16px;margin-bottom:16px;border-left:4px solid var(--orange);box-shadow:var(--shadow)}
.banner strong{display:block;margin-bottom:2px}
.banner-text{font-size:15px;color:var(--text2)}
.banner-text strong{color:var(--text);font-size:17px}
.banner-actions{display:flex;gap:6px;align-items:center;margin-top:10px}

/* deck overview */
.hero{background:var(--cell);border-radius:16px;padding:18px 16px 16px;box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin-bottom:16px}
.stat b{display:block;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.stat span{font-size:13px;color:var(--text2)}
.stat.new b{color:var(--blue)}.stat.lrn b{color:var(--red)}.stat.rev b{color:var(--green)}
.stat.zero b{color:var(--text3)}
.hero-note{font-size:14px;color:var(--text2);text-align:center;margin-top:10px}
.stepper{display:flex;align-items:center;gap:2px}
.stepper button{width:40px;height:34px;border-radius:9px;background:var(--fill);color:var(--blue);font-size:22px;font-weight:500;line-height:1}
.row .stepper input{width:3.2em;text-align:center;color:var(--text);font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px;border-radius:10px;background:var(--fill);width:100%}
.seg button{min-height:34px;border-radius:8px;font-size:14px;font-weight:500;color:var(--text);text-align:center;white-space:nowrap}
.seg button.on{background:var(--cell);box-shadow:0 1px 3px rgba(0,0,0,.14)}
@media (prefers-color-scheme:dark){.seg button.on{background:#636366}}
.row.col{flex-direction:column;align-items:stretch;gap:10px}

/* search */
.search{position:sticky;top:calc(44px + var(--sat));z-index:10;background:var(--bg);padding:8px 0 10px;margin-top:-8px}
.search label{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;padding:0 10px;color:var(--text2)}
.search input{flex:1;-webkit-appearance:none;appearance:none;border:0;background:none;color:var(--text);font-size:17px;padding:9px 0;min-width:0}
.search svg{width:18px;height:18px}
.card-row{align-items:flex-start}
.card-row .row-title{font-weight:500}
.card-row .row-sub{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tag{flex:none;font-size:12px;font-weight:600;padding:3px 8px;border-radius:7px;background:var(--fill);color:var(--text2);margin-top:2px;white-space:nowrap}
.tag.new{color:var(--blue)}.tag.lrn{color:var(--red)}.tag.due{color:var(--green)}

/* forms */
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:13px;color:var(--text2);margin:0 4px 5px;text-transform:uppercase;letter-spacing:.3px}
.field textarea,.field input,.field select{width:100%;border:0;border-radius:12px;background:var(--cell);color:var(--text);font:inherit;font-size:17px;padding:12px 14px}
.field textarea{resize:vertical;min-height:88px;line-height:1.35}
.sheet .field textarea,.sheet .field input,.sheet .field select{background:var(--cell)}
.paste{min-height:140px!important;font-family:ui-monospace,Menlo,monospace!important;font-size:15px!important}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;font-size:200px;cursor:pointer}
.check{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:31px;background:var(--fill);transition:background .2s}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .2s}
.switch input:checked+i{background:var(--green)}
.switch input:checked+i::after{transform:translateX(20px)}
.preview{overflow:auto;-webkit-overflow-scrolling:touch;background:var(--cell);border-radius:12px;max-height:300px}
.preview table{border-collapse:collapse;font-size:14px;min-width:100%}
.preview th,.preview td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:.5px solid var(--sep);max-width:220px;white-space:pre-wrap;overflow-wrap:anywhere}
.preview th{position:sticky;top:0;background:var(--cell2);font-weight:600;font-size:12px;white-space:nowrap}
.preview td.f{background:rgba(0,122,255,.10)}.preview td.b{background:rgba(52,199,89,.12)}
.preview th .pill{display:inline-block;font-size:10px;padding:1px 5px;border-radius:5px;color:#fff;margin-left:4px;vertical-align:1px}
.pill.f{background:var(--blue)}.pill.b{background:var(--green)}
.meta-line{font-size:14px;color:var(--text2);margin:10px 4px 0}
.err{color:var(--red);font-size:15px;margin:8px 4px}
.result{background:var(--cell);border-radius:16px;padding:22px 18px;text-align:center;box-shadow:var(--shadow)}
.result .big{font-size:22px;font-weight:700;margin-bottom:4px}
.result p{color:var(--text2);margin:4px 0 16px}

/* study */
.study{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.study-top{padding:var(--sat) max(6px,var(--sar)) 0 max(6px,var(--sal));display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:calc(48px + var(--sat))}
.study-top .nav-r{justify-self:end}
.qcounts{display:flex;gap:14px;font-weight:700;font-variant-numeric:tabular-nums;font-size:17px}
.qcounts span{padding:2px 2px;border-bottom:2px solid transparent;min-width:18px;text-align:center}
.qcounts .n{color:var(--blue)}.qcounts .l{color:var(--red)}.qcounts .r{color:var(--green)}
.qcounts .cur{border-bottom-color:currentColor}
.study-body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:6px max(14px,var(--sar)) 10px max(14px,var(--sal))}
.fcard{flex:1 0 auto;width:100%;max-width:720px;margin:0 auto;background:var(--cell);border-radius:22px;box-shadow:var(--shadow);padding:30px 22px;display:flex;flex-direction:column;justify-content:center;cursor:pointer}
.fq,.fa{font-size:27px;line-height:1.32;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;font-weight:500}
.fa{font-weight:400}
.fcard.long .fq,.fcard.long .fa{font-size:19px;text-align:left;line-height:1.45}
.fcard.revealed .fq{color:var(--text2)}
.fsep{height:1px;background:var(--sep);margin:22px 0}
.dir-badge{align-self:center;font-size:12px;font-weight:600;color:var(--text2);background:var(--fill);border-radius:7px;padding:3px 8px;margin-bottom:18px}
.tap-hint{text-align:center;color:var(--text3);font-size:14px;margin-top:26px}
.study-bottom{padding:8px max(12px,var(--sar)) calc(10px + var(--sab)) max(12px,var(--sal))}
.study-bottom .btn{min-height:58px;border-radius:16px;font-size:18px;max-width:720px;margin:0 auto}
.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:720px;margin:0 auto}
.ans{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:66px;border-radius:16px;background:var(--cell);font-weight:600;font-size:16px}
.ans small{font-size:13px;font-weight:500;opacity:.85;font-variant-numeric:tabular-nums}
.ans:active{filter:brightness(.9)}
.ans.again{color:var(--red);background:color-mix(in srgb,var(--red) 14%,var(--cell))}
.ans.hard{color:var(--orange);background:color-mix(in srgb,var(--orange) 14%,var(--cell))}
.ans.good{color:var(--green);background:color-mix(in srgb,var(--green) 15%,var(--cell))}
.ans.easy{color:var(--blue);background:color-mix(in srgb,var(--blue) 14%,var(--cell))}
.done{max-width:520px;margin:0 auto;text-align:center;padding:40px 10px}
.done .big{font-size:26px;font-weight:700;margin:16px 0 6px}
.done p{color:var(--text2);margin:0 0 22px}
.done-mark{width:76px;height:76px;margin:0 auto;border-radius:50%;background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green);display:flex;align-items:center;justify-content:center}
.done-mark svg{width:40px;height:40px;stroke-width:2.6}

/* modal */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.42);display:flex;align-items:flex-start;justify-content:center;padding:calc(var(--sat) + 22px) max(12px,var(--sar)) 20px max(12px,var(--sal));overflow:auto;animation:fade .18s ease-out}
.sheet{width:100%;max-width:540px;background:var(--bg);border-radius:18px;padding:18px 16px 16px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .22s cubic-bezier(.2,.9,.3,1.2)}
.sheet-title{font-size:20px;font-weight:700;margin:0 4px 12px}
.sheet-msg{margin:0 4px 16px;color:var(--text2);line-height:1.45}
.sheet-actions{display:flex;gap:10px;margin-top:6px}
.sheet-actions .btn{flex:1;margin:0}
.sheet-extra{display:flex;justify-content:space-between;gap:8px;margin-top:12px;flex-wrap:wrap}
.sheet-extra button{color:var(--blue);font-size:15px;padding:8px 4px;min-height:40px}
.sheet-extra button.red{color:var(--red)}
.status-line{font-size:13px;color:var(--text2);margin:2px 4px 12px;line-height:1.5}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(-12px) scale(.98)}}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(72px + var(--sab));transform:translateX(-50%) translateY(20px);z-index:200;max-width:min(92vw,480px);background:rgba(40,40,44,.96);color:#fff;border-radius:14px;padding:12px 16px;font-size:15px;display:flex;gap:12px;align-items:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 8px 30px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#toast button{color:#64d2ff;font-weight:600;padding:4px 2px;white-space:nowrap}
body.studying #toast{bottom:calc(110px + var(--sab))}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const Store = {
  kind: 'memory', db: null, lsTimer: 0, failed: false,
  async init() {

      try { this.attach(await withTimeout(idbOpen(), 4000)); this.kind = 'indexeddb'; } catch (e) { console.warn('IndexedDB:', e); }
    }
    if (this.kind !== 'indexeddb') this.kind = lsOK() ? 'localstorage' : 'memory';
  },
  attach(db) { this.db = db; db.onclose = () => { this.db = null; }; db.onversionchange = () => { db.close(); this.db = null; }; },
  async handle() { if (!this.db) this.attach(await idbOpen()); return this.db; },
  async run(stores, fn) {
    try { await idbTx(await this.handle(), stores, 'readwrite', fn); }

  fail(e) { console.error(e); if (!Store.failed) { Store.failed = true; toast('Could not save to device storage: ' + (e && e.message || e)); } },
  async load() {

      const db = await this.handle();

      meta = Object.fromEntries(meta.map(m => [m.key, m.value]));
      // If an earlier launch had to fall back to localStorage, migrate that data in.
      const ls = lsRead();

        const nd = ls.decks.filter(d => !dk.has(d.id)), nc = (ls.cards || []).filter(c => !ck.has(c.id));

          for (const k in (ls.meta || {})) if (!(k in meta)) M.put({ key: k, value: ls.meta[k] });
        });

  put(store, objs) {

  },
  del(store, ids) {

    else this.lsSave();
  },
  putMeta(key, value) {
    if (this.kind === 'indexeddb') this.run('meta', os => os.put({ key, value })).catch(e => this.fail(e));
    else this.lsSave();
  },
  async replaceAll(decks, cards, meta) {
    if (this.kind === 'indexeddb') {
      await this.run(['decks', 'cards', 'meta'], (D, C, M) => {
        D.clear(); C.clear(); M.clear();

  },
  lsSave() { if (this.kind !== 'localstorage') return; clearTimeout(this.lsTimer); this.lsTimer = setTimeout(() => this.lsFlush(), 300); },
  lsFlush() {
    if (this.kind !== 'localstorage') return;

    catch (e) { this.fail(e); }
  },

  let best = null, bestDue = Infinity, ahead = null, aheadDue = Infinity;
  for (const card of cardsIn(deck.id)) for (const dir of dirs) {
    const st = card[dir];
    if (!st || (st.t !== LRN && st.t !== RLN)) continue;
    if (st.due <= now) { if (st.due < bestDue) { best = { card, dir }; bestDue = st.due; } }
    else if (st.due < aheadDue) { ahead = { card, dir }; aheadDue = st.due; }
  }
  if (best) return best;
  while (sess.pos < sess.order.length) {
    const it = sess.order[sess.pos], card = S.cards.get(it.card.id);
    if (card && card.deckId === deck.id && dirs.includes(it.dir) && !isBuried(card, it.dir, deck, today)) {
      const st = card[it.dir], t = st ? st.t : NEW;
      if ((t === REV && st.due <= today) || (t === NEW && newLeft(deck, today) > 0)) return { card, dir: it.dir, fromOrder: true };

}

  let n = 0, l = 0, r = 0, nl = newLeft(deck, today);
  for (const card of cardsIn(deck.id)) for (const dir of dirs) { const st = card[dir]; if (st && (st.t === LRN || st.t === RLN) && st.due < eod) l++; }
  for (let i = sess.pos; i < sess.order.length; i++) {
    const it = sess.order[i], card = S.cards.get(it.card.id);
    if (!card || card.deckId !== deck.id || isBuried(card, it.dir, deck, today)) continue;
    const st = card[it.dir];

function StudyView(id) {

  if (!SESS || SESS.deckId !== id || lastRoute !== route()) SESS = startSession(deck);
  const sess = SESS;
  const root = h('div', { class: 'study' });
  const close = () => { SESS = null; back('/deck/' + encodeURIComponent(id)); };

  const draw = () => {
    stopStudyTimer();
    if (!sess.cur) { sess.cur = nextItem(sess); sess.revealed = false; }
    const cur = sess.cur, cnt = queueCounts(sess);
    const curQ = cur ? (cur.card[cur.dir] ? (cur.card[cur.dir].t === REV ? 'r' : 'l') : 'n') : '';

    const top = h('header', { class: 'study-top' },

        cur && h('button', { class: 'navbtn', 'aria-label': 'Edit card', onclick: () => editCard(cur.card, deck.id, () => { if (!S.cards.has(cur.card.id) || cur.card.deckId !== deck.id) sess.cur = null; draw(); }) }, icon('edit')),
        undoBtn));
    let body, bottom;
    if (!cur) {
      const today = dayIndex(Date.now());

      const wait = sess.waitUntil;
      body = h('div', { class: 'done' },

    } else {

        sess.revealed && h('div', { class: 'fsep' }),
        sess.revealed && h('div', { class: 'fa', html: rich(aText) }),
        !sess.revealed && h('div', { class: 'tap-hint' }, 'Tap to reveal'));
      body = card;
      if (!sess.revealed) bottom = h('button', { class: 'btn', onclick: reveal }, 'Show answer');
      else {
        const now = Date.now(), prev = cur.card[cur.dir];
        const names = ['Again', 'Hard', 'Good', 'Easy'], cls = ['again', 'hard', 'good', 'easy'];
        bottom = h('div', { class: 'answers' }, [1, 2, 3, 4].map(b =>
          h('button', { class: 'ans ' + cls[b - 1], onclick: () => answer(b) }, h('small', null, schedule(prev, b, now, false).label), names[b - 1])));

    const prev = cur.card[cur.dir] ? { ...cur.card[cur.dir] } : null;
    sess.undo.push({ cur, prev, pos: sess.pos, done: sess.done, newDay: deckNow.newDay, newCount: deckNow.newCount });
    if (sess.undo.length > 30) sess.undo.shift();

    if (!prev) { if (deckNow.newDay !== today) { deckNow.newDay = today; deckNow.newCount = 0; } deckNow.newCount++; saveDeck(deckNow); }

    if (openModals || !route().startsWith('/study/')) return;

/* ---------- Import ---------- */
const IMP = { text: '', name: '', enc: '', delim: 'auto', header: null, front: 0, back: 1, target: 'new', newName: '', result: null, pasteOpen: false, memo: null };
function impParse() {
  const delim = IMP.delim === 'auto' ? detectDelim(IMP.text) : IMP.delim;
  if (!IMP.memo || IMP.memo.text !== IMP.text || IMP.memo.delim !== delim) IMP.memo = { text: IMP.text, delim, rows: parseCSV(IMP.text, delim) };
  const rows = IMP.memo.rows;
  const header = IMP.header ?? guessHeader(rows);
  const ncols = rows.reduce((m, r) => Math.max(m, r.length), 0);
  return { delim, rows, header, ncols, data: header ? rows.slice(1) : rows };
}
function loadImportText(text, name, enc) {
  IMP.text = text.replace(/^﻿/, ''); IMP.name = name; IMP.enc = enc; IMP.delim = 'auto'; IMP.header = null;
  IMP.front = 0; IMP.back = 1; IMP.result = null; IMP.memo = null;
  IMP.newName = name.replace(/\.(csv|tsv|txt)$/i, '') || 'New deck';
  const p = impParse();
  if (p.header && p.rows[0]) {
    const hdr = p.rows[0].map(s => norm(s.trim()));
    const fi = hdr.findIndex(s => /^(front|question|term|word|pregunta|anverso|frente|frage)$/.test(s));
    const bi = hdr.findIndex(s => /^(back|answer|definition|meaning|translation|respuesta|reverso|dorso|antwort|bedeutung)$/.test(s));
    if (fi >= 0) IMP.front = fi; if (bi >= 0 && bi !== IMP.front) IMP.back = bi;
  }
  render(true);
}

  if (IMP.result) {
    const r = IMP.result, d = S.decks.get(r.deckId);
    const skipped = [r.dup && plural(r.dup, 'duplicate'), r.empty && `${plural(r.empty, 'row')} with an empty side`].filter(Boolean);

      d && h('button', { class: 'btn sec', onclick: () => { IMP.result = null; go('/deck/' + encodeURIComponent(d.id), { replace: true }); } }, 'Open deck'),
      h('button', { class: 'btn sec', onclick: () => { IMP.result = null; render(); } }, 'Import another file')));
  }

  const fileInput = h('input', { type: 'file', accept: '.csv,.tsv,.txt,text/csv,text/plain,text/tab-separated-values,text/comma-separated-values,application/csv', 'aria-label': 'Choose CSV file',

    } });

  // what would happen
  let ok = 0, empty = 0, dup = 0;
  const existing = new Set(IMP.target !== 'new' ? cardsIn(IMP.target).map(c => dupKey(c.front, c.back)) : []);
  for (const r of p.data) {
    const f = clean(r[IMP.front]), b = clean(r[IMP.back]);
    if (!f || !b) { empty++; continue; }
    const k = dupKey(f, b); if (existing.has(k)) { dup++; continue; } existing.add(k); ok++;

    h('div', { class: 'list' },

    h('p', { class: 'foot' }, [`${plural(ok, 'card')} will be added.`, dup && ` ${plural(dup, 'duplicate')} will be skipped.`, empty && ` ${plural(empty, 'row')} with an empty side will be skipped.`].filter(Boolean).join('')),
    h('div', { style: 'margin-top:18px' },

function doImport(p) {
  const deck = IMP.target === 'new' ? null : S.decks.get(IMP.target);
  const existing = new Set(deck ? cardsIn(deck.id).map(c => dupKey(c.front, c.back)) : []);
  const pairs = []; let empty = 0, dup = 0;
  for (const r of p.data) {
    const f = clean(r[IMP.front]), b = clean(r[IMP.back]);
    if (!f || !b) { empty++; continue; }
    const k = dupKey(f, b); if (existing.has(k)) { dup++; continue; }
    existing.add(k); pairs.push([f, b]);
  }
  if (!pairs.length) return;
  const target = deck || newDeck(IMP.newName || 'Imported');
  const base = nextOrd(pairs.length);
  saveCards(pairs.map(([f, b], i) => makeCard(target.id, f, b, base + i)));

/* ---------- Settings ---------- */
function parseSteps(s) {
  const out = [];
  for (const tok of String(s).trim().split(/[\s,]+/).filter(Boolean)) {
    const m = tok.match(/^(\d+(?:\.\d+)?)(s|m|h|d)?$/i);
    if (!m) return null;
    const v = parseFloat(m[1]) * ({ s: 1 / 60, m: 1, h: 60, d: 1440 }[(m[2] || 'm').toLowerCase()]);
    if (!(v > 0)) return null; out.push(v);
  }
  return out;
}
const stepsText = a => a.map(m => m % 1440 === 0 ? m / 1440 + 'd' : m % 60 === 0 && m >= 60 ? m / 60 + 'h' : m < 1 ? Math.round(m * 60) + 's' : m + 'm').join(' ');

  const bs = backupStatus();
  const saveSetting = (k, v) => { setMeta('settings', { ...(S.meta.settings || {}), [k]: v }); applySettings(); toast('Saved'); };
  const stepsInput = (k, allowEmpty) => h('input', { type: 'text', value: stepsText(CFG[k]), autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false',
    onchange: e => { const v = parseSteps(e.target.value); if (!v || (!v.length && !allowEmpty)) { toast('Use values like “1m 10m”'); e.target.value = stepsText(CFG[k]); return; } saveSetting(k, v); e.target.value = stepsText(v); } });
  const numInput = (k, min, max) => h('input', { type: 'number', inputmode: 'numeric', min, max, value: CFG[k],
    onchange: e => { const v = Math.round(num(e.target.value, NaN)); if (!(v >= min && v <= max)) { toast(`Enter ${min}–${max}`); e.target.value = CFG[k]; return; } saveSetting(k, v); } });
  const restoreInput = h('input', { type: 'file', accept: '.json,application/json', 'aria-label': 'Choose backup file',
    onchange: e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) restoreFrom(f); } });
  const storageLabel = { indexeddb: 'IndexedDB', localstorage: 'localStorage', memory: 'Memory only (not saved!)' }[Store.kind];
  const persistVal = h('span', { class: 'row-val' }, '…');
  if (navigator.storage && navigator.storage.persisted) navigator.storage.persisted().then(v => { persistVal.textContent = v ? 'Yes' : 'Not granted'; }).catch(() => { persistVal.textContent = 'Unknown'; });

    section('Backup',

        h('span', { class: 'row-val' }, bs.last ? relTime(bs.last) : 'never')),

      h('label', { class: 'row' }, h('div', { class: 'row-main' }, 'Relearning steps'), stepsInput('relearn', true)),
      h('label', { class: 'row' }, h('div', { class: 'row-main' }, 'Graduating interval (days)'), numInput('grad', 1, 365)),
      h('label', { class: 'row' }, h('div', { class: 'row-main' }, 'Easy interval (days)'), numInput('easy', 1, 365)),
      h('label', { class: 'row' }, h('div', { class: 'row-main' }, 'Next day starts at (hour)'), numInput('rollover', 0, 23)),
      h('button', { class: 'row blue', onclick: async () => { if (await confirmBox('Reset scheduling?', 'Restore the Anki default values above.', 'Reset')) { setMeta('settings', {}); applySettings(); render(true); } } },
        h('div', { class: 'row-main' }, 'Restore defaults'))),
    foot('Defaults match Anki: steps 1m 10m, relearn 10m, graduate after 1 day, easy 4 days, new day at 4 am. New cards per day is set per deck.'),
    section('Storage',

      h('div', { class: 'row' }, h('div', { class: 'row-main' }, 'Persistent storage'), persistVal),
      h('div', { class: 'row' }, h('div', { class: 'row-main' }, 'Contents'), h('span', { class: 'row-val' }, `${plural(S.decks.size, 'deck')}, ${plural(S.cards.size, 'card')}`))),
    !standalone && foot('Tip: in Safari, Share → Add to Home Screen, then open it from there. The Home Screen app keeps its own data, separate from Safari tabs.'),
    section(null,

/* =====================================================================
   Boot
   ===================================================================== */
async function boot() {
  await Store.init();
  try {
    const data = await Store.load();
    data.decks.forEach(d => S.decks.set(d.id, d));
    data.cards.forEach(c => S.cards.set(c.id, c));
    S.meta = data.meta || {};
  } catch (e) { console.error(e); toast('Could not load saved data: ' + e.message); }
  applySettings();
  if (!history.state) history.replaceState({ d: 0 }, '', location.hash || '#/');
  render();
  if (Store.kind === 'memory') toast('Storage is unavailable here, so nothing will be saved. Is Private Browsing on?');
  if (Store.kind === 'indexeddb' && S.cards.size && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}
window.addEventListener('pagehide', () => { if (S.meta.lastChange) Store.putMeta('lastChange', S.meta.lastChange); Store.lsFlush(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (S.meta.lastChange) Store.putMeta('lastChange', S.meta.lastChange); Store.lsFlush(); }
  else if (!route().startsWith('/study/') && !openModals && !(document.activeElement && document.activeElement.matches('input,textarea,select'))) render(true); // refresh due counts after the day changes
});

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data && e.data.type === 'updated') toast('A new version is ready.', { label: 'Reload', fn: () => location.reload() });
  });
}
boot();
